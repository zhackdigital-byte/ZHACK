<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Bill Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand">MessCalc</div>
        <div class="nav-links">
            <a href="reports.html" class="nav-link">History</a>
            <button id="logout-btn" class="nav-btn">Logout</button>
        </div>
    </nav>

    <div class="app-container" style="margin-top: 5rem;">
        <header>
            <h1>Mess Bill Calculator</h1>
            <p>Calculate monthly expenses for 4 people easily.</p>
        </header>

        <main>
            <div class="input-group" style="max-width: 300px; margin: 0 auto 2rem auto;">
                <label for="report-month" style="text-align: center;">Month & Year (e.g. April 2026)</label>
                <input type="text" id="report-month" placeholder="Enter Month & Year" required>
            </div>

            <div class="cards-wrapper">
                <!-- Person 1 -->
                <div class="person-card">
                    <h2>Person 1</h2>
                    <div class="input-group">
                        <label for="name1">Name</label>
                        <input type="text" id="name1" placeholder="Enter name" value="Person 1">
                    </div>
                    <div class="input-group">
                        <label for="amount1">Amount Spent ($)</label>
                        <input type="number" id="amount1" placeholder="0.00" min="0" step="0.01">
                    </div>
                </div>

                <!-- Person 2 -->
                <div class="person-card">
                    <h2>Person 2</h2>
                    <div class="input-group">
                        <label for="name2">Name</label>
                        <input type="text" id="name2" placeholder="Enter name" value="Person 2">
                    </div>
                    <div class="input-group">
                        <label for="amount2">Amount Spent ($)</label>
                        <input type="number" id="amount2" placeholder="0.00" min="0" step="0.01">
                    </div>
                </div>

                <!-- Person 3 -->
                <div class="person-card">
                    <h2>Person 3</h2>
                    <div class="input-group">
                        <label for="name3">Name</label>
                        <input type="text" id="name3" placeholder="Enter name" value="Person 3">
                    </div>
                    <div class="input-group">
                        <label for="amount3">Amount Spent ($)</label>
                        <input type="number" id="amount3" placeholder="0.00" min="0" step="0.01">
                    </div>
                </div>

                <!-- Person 4 -->
                <div class="person-card">
                    <h2>Person 4</h2>
                    <div class="input-group">
                        <label for="name4">Name</label>
                        <input type="text" id="name4" placeholder="Enter name" value="Person 4">
                    </div>
                    <div class="input-group">
                        <label for="amount4">Amount Spent ($)</label>
                        <input type="number" id="amount4" placeholder="0.00" min="0" step="0.01">
                    </div>
                </div>
            </div>

            <div class="actions">
                <button id="calculate-btn">Calculate Bill</button>
            </div>

            <div id="results" class="results-section hidden">
                <div class="summary-cards">
                    <div class="summary-card">
                        <h3>Total Expense</h3>
                        <p id="total-amount">$0.00</p>
                    </div>
                    <div class="summary-card">
                        <h3>Per Head Share</h3>
                        <p id="per-head-amount">$0.00</p>
                    </div>
                </div>

                <div class="settlements-container">
                    <h3>Who owes whom?</h3>
                    <ul id="settlements-list">
                        <!-- Settlements injected via JS -->
                    </ul>
                </div>

                <div class="actions" style="margin-top: 2rem;">
                    <button id="save-report-btn" class="save-btn">Save Report to Supabase</button>
                    <p id="save-status" class="status-msg hidden"></p>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
